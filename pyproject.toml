[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadvision"
version = "1.0.0"
description = "Object detection for self-driving cars: CIFAR-10 vehicle classification, sliding windows, transfer learning and YOLOv3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115  # the Darknet layer table reads better aligned than wrapped
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E402: the scripts and the app deliberately extend sys.path before importing
# the package, so their imports cannot all sit at the top of the file.
ignore = ["E402"]
